[package]
name = "anomaly-ui-editor"
version = "0.6.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31.1"
xmlparser = "0.13"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["dds", "png", "tga", "jpeg", "ico"] }
rfd = "0.15"
walkdir = "2"
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"] }

[profile.release]
opt-level = 2

